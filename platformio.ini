; ============================================================
;  赛博自建房 · AI 语音智能家居系统（ESP32-S3-N16R8）
; ------------------------------------------------------------
;  8 个独立功能模块 + 1 套完整系统，各自独立编译。
;  烧录某个模块：
;    方式一：把下面 default_envs 改成对应模块名，再编译上传
;    方式二：命令行 pio run -e m03_dht11 -t upload
;  模块列表：
;    m01_led         灯光模块      AI 语音对话控制 LED
;    m02_buzzer      蜂鸣器模块    AI 语音对话控制蜂鸣器
;    m03_dht11       温湿度模块    AI 语音对话查询 DHT11
;    m04_flame       火焰模块      AI 语音对话查询火焰传感器
;    m05_rain        雨水模块      AI 语音对话查询雨水传感器
;    m06_mq2         烟雾模块      AI 语音对话查询 MQ2 传感器
;    m07_fan         风扇模块      AI 语音对话控制风扇
;    m08_pir         人体感应模块  AI 语音对话查询人体红外
;    m09_smart_house 赛博自建房    完整 AI 智能家居系统（+OLED 联动）
; ============================================================

[platformio]
default_envs = m09_smart_house

[env]
platform = espressif32@6.0.1          ; Arduino-ESP32 Core 2.0.7 同代（WCMGC 预编译库指定，勿升级）
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; ---- 16MB Flash + 8MB OPI PSRAM（N16R8）----
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv   ; 4MB APP + 4MB 语音模型 + 7MB SPIFFS

; ---- 编译选项 ----
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    ; WCMGC_Comm 预编译库整体链接（whole-archive）
    -Llib/WCMGC_Comm/src/esp32s3
    -Wl,--whole-archive -lWCMGC_Comm -Wl,--no-whole-archive

lib_deps =
    bblanchon/ArduinoJson@6.21.5
    knolleary/PubSubClient@2.8
    madhephaestus/ESP32Servo@0.13.0
    olikraus/U8g2@^2.36.18
    h2zero/NimBLE-Arduino@1.4.1
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

; ---------------- 编译目标 ----------------
[env:m01_led]
build_src_filter = +<m01_led/>

[env:m02_buzzer]
build_src_filter = +<m02_buzzer/>

[env:m03_dht11]
build_src_filter = +<m03_dht11/>

[env:m04_flame]
build_src_filter = +<m04_flame/>

[env:m05_rain]
build_src_filter = +<m05_rain/>

[env:m06_mq2]
build_src_filter = +<m06_mq2/>

[env:m07_fan]
build_src_filter = +<m07_fan/>

[env:m08_pir]
build_src_filter = +<m08_pir/>

[env:m09_smart_house]
build_src_filter = +<m09_smart_house/>
